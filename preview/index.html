<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Classic Steam Preview</title>
    <style>
      :root {
        --ui-bg: #1e211b;
        --ui-panel: #2b3026;
        --ui-text: #d8ded3;
        --ui-dim: #8a9480;
        --ui-accent: #c4b550;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--ui-bg); color: var(--ui-text); font: 13px/1.4 Tahoma, Verdana, sans-serif; }
      header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 10px 16px; background: var(--ui-panel); border-bottom: 1px solid #000; }
      header h1 { font-size: 14px; margin: 0; color: var(--ui-accent); }
      label { display: inline-flex; gap: 6px; align-items: center; color: var(--ui-dim); }
      select, button { font: inherit; color: var(--ui-text); background: var(--ui-bg); border: 1px solid #555; padding: 3px 6px; }
      #patches { display: contents; }
      main { display: grid; place-items: center; padding: 16px; }
      #stage { width: 1280px; height: 800px; outline: 1px solid #000; background: #000; }
      iframe { width: 1280px; height: 800px; border: 0; display: block; }
      #empty { max-width: 640px; color: var(--ui-dim); }
      #empty code { color: var(--ui-text); }
      #status { margin-left: auto; color: var(--ui-dim); }
    </style>
  </head>
  <body>
    <header>
      <h1>Classic Steam preview</h1>
      <label>Surface <select id="surface"></select></label>
      <label>Capture <select id="version"></select></label>
      <label>Translations
        <select id="branch"><option>stable</option><option>beta</option></select>
      </label>
      <label><input type="checkbox" id="themeOn" checked /> Theme</label>
      <label><input type="checkbox" id="fit" checked /> Fit</label>
      <span id="patches"></span>
      <span id="status"></span>
    </header>
    <main>
      <div id="stage"><iframe id="frame" title="Steam surface"></iframe></div>
      <div id="empty" hidden>
        <p>No fixtures yet. On the Deck, open the surface you want, then run:</p>
        <p><code>npm run capture -- --surface library</code></p>
        <p>See <code>docs/testing.md</code>.</p>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
